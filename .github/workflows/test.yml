# Тесты на каждый push и PR + проверка, что нейтральная сборка не содержит бренда партнёра.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Нейтральная сборка без бренда
        run: |
          VITE_NEUTRAL=1 npx vite build
          node scripts/check-neutral.mjs dist
