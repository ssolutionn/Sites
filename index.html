<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Симулятор новогодней суеты</title>
    <link rel="icon" href="./assets/logo-5.svg" />
    <link rel="stylesheet" href="./src/ui/style.css" />
    <link rel="stylesheet" href="./src/ui/campaign.css" />
    <link rel="stylesheet" href="./src/ui/theme.css" />
    <link rel="stylesheet" href="./src/ui/settings.css" />
  </head>
  <body class="campaign">
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <div id="hud" class="hidden"></div>
      <div id="panel" class="hidden"></div>
      <div id="recipe" class="card hidden"></div>
      <div id="phone" class="phone-mode hidden"></div>
      <div id="alerts"></div>
      <div id="tip" class="card hidden"></div>
      <div id="hint" class="hidden"></div>
      <div id="toasts"></div>
      <div id="drag-ghost" class="hidden"></div>
      <div id="overlay"></div>
      <div id="dev" class="hidden"></div>
      <div id="fatal" class="hidden"></div>
      <div id="loading" role="status" aria-live="polite">
        <div class="loading-card">
          <div class="loading-symbol" aria-hidden="true">🎄</div>
          <h1>Новогодняя суета</h1>
          <p>Готовим уютную кухню…</p>
          <progress id="loading-progress" max="100" aria-label="Подготовка кухни"></progress>
          <p id="loading-detail">Скоро начнём готовить</p>
        </div>
      </div>
    </div>
    <noscript>Для игры нужен JavaScript.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
